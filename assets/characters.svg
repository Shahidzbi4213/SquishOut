<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="100%">
  <defs>
    <!-- Background Frame -->
    <linearGradient id="charBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Strawberry Blobby -->
    <radialGradient id="cSb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFA8BA"/>
      <stop offset="50%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </radialGradient>

    <!-- Blueberry Drop -->
    <radialGradient id="cBb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#90E0EF"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </radialGradient>

    <!-- Lemon Spark -->
    <radialGradient id="cLm" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Kiwi Hopper -->
    <radialGradient id="cKw" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#06D6A0"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <!-- Grape Eel -->
    <radialGradient id="cEel" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E0AAFF"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#5A189A"/>
    </radialGradient>

    <!-- King Jelly -->
    <radialGradient id="cKing" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#FB8500"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>

    <!-- Cosmic Nebula -->
    <radialGradient id="cCosmic" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </radialGradient>

    <filter id="cShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="836" height="256" rx="24" fill="url(#charBg)" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header Title -->
  <g transform="translate(30, 26)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Fredoka', 'Nunito', sans-serif" font-size="18" font-weight="900" fill="#1E293B">
      🐾 Meet The Squishies — Jelly Dex Roster
    </text>
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="12" font-weight="600" fill="#64748B">
      Each companion features directional escape anatomy, dynamic eyelid states, and unique metagame perks.
    </text>
  </g>

  <!-- 6 Character Cards (Width: 120px each, Spacing: 12px) -->

  <!-- 1. Strawberry Blobby -->
  <g transform="translate(30, 68)" filter="url(#cShadow)">
    <rect x="0" y="0" width="105" height="165" rx="16" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
    <!-- Blobby Sprite -->
    <g transform="translate(26, 16)">
      <rect x="0" y="0" width="52" height="52" rx="18" fill="url(#cSb)"/>
      <path d="M 18 2 Q 26 -8 34 2 Z" fill="#FF4D6D"/>
      <rect x="8" y="6" width="18" height="10" rx="5" fill="#FFFFFF" opacity="0.6"/>
      <!-- Eyes Awake -->
      <circle cx="17" cy="24" r="4.5" fill="#881337"/>
      <circle cx="16" cy="23" r="1.5" fill="#FFFFFF"/>
      <circle cx="35" cy="24" r="4.5" fill="#881337"/>
      <circle cx="34" cy="23" r="1.5" fill="#FFFFFF"/>
      <path d="M 22 34 Q 26 38 30 34" fill="none" stroke="#881337" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Rarity Pill -->
    <rect x="24" y="78" width="56" height="18" rx="9" fill="#FFF1F2"/>
    <text x="52" y="90" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#E11D48" text-anchor="middle">COMMON</text>
    <text x="52" y="112" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#1E293B" text-anchor="middle">Strawberry</text>
    <text x="52" y="128" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#E11D48" text-anchor="middle">▲ North</text>
    <text x="52" y="148" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">Starter Mascot</text>
  </g>

  <!-- 2. Blueberry Drop -->
  <g transform="translate(145, 68)" filter="url(#cShadow)">
    <rect x="0" y="0" width="105" height="165" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <!-- Blueberry Sprite -->
    <g transform="translate(26, 16)">
      <rect x="0" y="0" width="52" height="52" rx="18" fill="url(#cBb)"/>
      <path d="M 50 18 Q 58 26 50 34 Z" fill="#00B4D8"/>
      <rect x="8" y="6" width="18" height="10" rx="5" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="28" cy="24" r="4.5" fill="#0C4A6E"/>
      <circle cx="30" cy="22" r="1.5" fill="#FFFFFF"/>
      <path d="M 24 34 Q 28 38 32 34" fill="none" stroke="#0C4A6E" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Rarity Pill -->
    <rect x="24" y="78" width="56" height="18" rx="9" fill="#F0F9FF"/>
    <text x="52" y="90" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#0284C7" text-anchor="middle">COMMON</text>
    <text x="52" y="112" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#1E293B" text-anchor="middle">Blueberry</text>
    <text x="52" y="128" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0284C7" text-anchor="middle">▶ East</text>
    <text x="52" y="148" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">Smooth Slide</text>
  </g>

  <!-- 3. Lemon Spark -->
  <g transform="translate(260, 68)" filter="url(#cShadow)">
    <rect x="0" y="0" width="105" height="165" rx="16" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <g transform="translate(26, 16)">
      <rect x="0" y="0" width="52" height="52" rx="18" fill="url(#cLm)"/>
      <path d="M 2 18 Q -6 26 2 34 Z" fill="#FFB703"/>
      <rect x="10" y="6" width="18" height="10" rx="5" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="22" cy="24" r="4.5" fill="#78350F"/>
      <circle cx="20" cy="22" r="1.5" fill="#FFFFFF"/>
      <path d="M 22 34 Q 26 38 30 34" fill="none" stroke="#78350F" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Rarity Pill -->
    <rect x="28" y="78" width="48" height="18" rx="9" fill="#FFFBEB"/>
    <text x="52" y="90" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#D97706" text-anchor="middle">RARE</text>
    <text x="52" y="112" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#1E293B" text-anchor="middle">Lemon Spark</text>
    <text x="52" y="128" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#D97706" text-anchor="middle">◀ West</text>
    <text x="52" y="148" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">+10% Candies</text>
  </g>

  <!-- 4. Kiwi Hopper -->
  <g transform="translate(375, 68)" filter="url(#cShadow)">
    <rect x="0" y="0" width="105" height="165" rx="16" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <g transform="translate(26, 16)">
      <rect x="0" y="0" width="52" height="52" rx="18" fill="url(#cKw)"/>
      <path d="M 18 50 Q 26 58 34 50 Z" fill="#06D6A0"/>
      <rect x="8" y="6" width="18" height="10" rx="5" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="17" cy="24" r="4.5" fill="#064E3B"/>
      <circle cx="16" cy="23" r="1.5" fill="#FFFFFF"/>
      <circle cx="35" cy="24" r="4.5" fill="#064E3B"/>
      <circle cx="34" cy="23" r="1.5" fill="#FFFFFF"/>
      <path d="M 22 34 Q 26 38 30 34" fill="none" stroke="#064E3B" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Rarity Pill -->
    <rect x="28" y="78" width="48" height="18" rx="9" fill="#ECFDF5"/>
    <text x="52" y="90" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#059669" text-anchor="middle">RARE</text>
    <text x="52" y="112" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#1E293B" text-anchor="middle">Kiwi Hopper</text>
    <text x="52" y="128" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">▼ South</text>
    <text x="52" y="148" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">+1 Free Hint</text>
  </g>

  <!-- 5. Grape Eel Duo (1x2 Multi-Tile) -->
  <g transform="translate(490, 68)" filter="url(#cShadow)">
    <rect x="0" y="0" width="105" height="165" rx="16" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <g transform="translate(32, 12)">
      <rect x="0" y="0" width="42" height="58" rx="16" fill="url(#cEel)"/>
      <path d="M 14 2 Q 21 -6 28 2 Z" fill="#9D4EDD"/>
      <rect x="6" y="5" width="14" height="8" rx="4" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="14" cy="20" r="3.5" fill="#3B0764"/>
      <circle cx="28" cy="20" r="3.5" fill="#3B0764"/>
      <text x="21" y="44" font-size="9" font-weight="800" fill="#E9D5FF" text-anchor="middle">1×2</text>
    </g>
    <rect x="24" y="78" width="56" height="18" rx="9" fill="#FAF5FF"/>
    <text x="52" y="90" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#7C3AED" text-anchor="middle">MYTHIC</text>
    <text x="52" y="112" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#1E293B" text-anchor="middle">Grape Eel</text>
    <text x="52" y="128" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#7C3AED" text-anchor="middle">▲ 1×2 Duo</text>
    <text x="52" y="148" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">Rainbow Trail</text>
  </g>

  <!-- 6. Honeycomb King Jelly (Boss 2x2) -->
  <g transform="translate(605, 68)" filter="url(#cShadow)">
    <rect x="0" y="0" width="105" height="165" rx="16" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5"/>
    <g transform="translate(24, 12)">
      <rect x="0" y="0" width="56" height="56" rx="20" fill="url(#cKing)"/>
      <!-- Crown -->
      <path d="M 12 -8 L 18 0 L 28 -12 L 38 0 L 44 -8 L 41 2 L 15 2 Z" fill="#FBBF24" stroke="#B45309" stroke-width="1"/>
      <circle cx="28" cy="-8" r="2" fill="#EF4444"/>
      <circle cx="18" cy="26" r="4.5" fill="#7C2D12"/>
      <circle cx="38" cy="26" r="4.5" fill="#7C2D12"/>
      <path d="M 23 38 Q 28 42 33 38" fill="none" stroke="#7C2D12" stroke-width="1.8" stroke-linecap="round"/>
      <text x="28" y="52" font-size="8" font-weight="800" fill="#FFF7ED" text-anchor="middle">2×2 BOSS</text>
    </g>
    <rect x="28" y="78" width="48" height="18" rx="9" fill="#FFF7ED"/>
    <text x="52" y="90" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#C2410C" text-anchor="middle">BOSS</text>
    <text x="52" y="112" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#1E293B" text-anchor="middle">King Jelly</text>
    <text x="52" y="128" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#C2410C" text-anchor="middle">👑 2×2 Grid</text>
    <text x="52" y="148" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">Confetti Blast</text>
  </g>

  <!-- 7. Cosmic Nebula (Legendary) -->
  <g transform="translate(720, 68)" filter="url(#cShadow)">
    <rect x="0" y="0" width="92" height="165" rx="16" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="52" height="52" rx="18" fill="url(#cCosmic)"/>
      <!-- Stardust Sparkle -->
      <path d="M 26 6 Q 26 12 30 12 Q 26 12 26 18 Q 26 12 22 12 Q 26 12 26 6 Z" fill="#FDE047"/>
      <circle cx="17" cy="26" r="4" fill="#FFFFFF"/>
      <circle cx="35" cy="26" r="4" fill="#FFFFFF"/>
      <path d="M 22 36 Q 26 40 30 36" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <rect x="14" y="78" width="64" height="18" rx="9" fill="#F5F3FF"/>
    <text x="46" y="90" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#6D28D9" text-anchor="middle">LEGENDARY</text>
    <text x="46" y="112" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#1E293B" text-anchor="middle">Cosmic</text>
    <text x="46" y="128" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#6D28D9" text-anchor="middle">✨ Nebula</text>
    <text x="46" y="148" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" fill="#64748B" text-anchor="middle">Daily Streak</text>
  </g>

</svg>
