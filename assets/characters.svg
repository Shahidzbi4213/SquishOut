<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="100%" height="100%">
  <defs>
    <!-- Background Frame -->
    <linearGradient id="cLineupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Character Gradients -->
    <radialGradient id="clSb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFA8BA"/>
      <stop offset="55%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </radialGradient>
    <radialGradient id="clBb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#90E0EF"/>
      <stop offset="55%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </radialGradient>
    <radialGradient id="clLm" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="55%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <radialGradient id="clKw" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="55%" stop-color="#06D6A0"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="clEel" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E0AAFF"/>
      <stop offset="55%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#5A189A"/>
    </radialGradient>
    <radialGradient id="clKing" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="55%" stop-color="#FB8500"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <radialGradient id="clCosmic" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </radialGradient>
    <linearGradient id="clCrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="clShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="836" height="166" rx="18" fill="url(#cLineupBg)" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 7 Characters Evenly Positioned Across 840px (Columns at X: 25, 140, 255, 370, 485, 600, 715) -->

  <!-- 1. Strawberry Blobby -->
  <g transform="translate(25, 14)">
    <g transform="translate(18, 6)" filter="url(#clShadow)">
      <rect x="-2" y="-2" width="68" height="68" rx="24" fill="none" stroke="#FDE047" stroke-width="2.5" opacity="0.85"/>
      <rect x="0" y="0" width="64" height="64" rx="22" fill="url(#clSb)"/>
      <path d="M 22 2 Q 32 -8 42 2 Z" fill="#FF4D6D"/>
      <rect x="10" y="8" width="24" height="12" rx="6" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="21" cy="30" r="5" fill="#881337"/>
      <circle cx="20" cy="29" r="1.5" fill="#FFFFFF"/>
      <circle cx="43" cy="30" r="5" fill="#881337"/>
      <circle cx="42" cy="29" r="1.5" fill="#FFFFFF"/>
      <path d="M 27 41 Q 32 46 37 41" fill="none" stroke="#881337" stroke-width="2" stroke-linecap="round"/>
    </g>
    <rect x="0" y="86" width="100" height="22" rx="11" fill="#FFE4E6"/>
    <text x="50" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="10.5" font-weight="800" fill="#E11D48" text-anchor="middle">
      Strawberry ▲
    </text>
    <text x="50" y="122" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">
      Common • 1×1
    </text>
  </g>

  <!-- 2. Blueberry Drop -->
  <g transform="translate(140, 14)">
    <g transform="translate(18, 6)" filter="url(#clShadow)">
      <rect x="0" y="0" width="64" height="64" rx="22" fill="url(#clBb)"/>
      <path d="M 62 22 Q 72 32 62 42 Z" fill="#00B4D8"/>
      <rect x="10" y="8" width="24" height="12" rx="6" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="36" cy="31" r="5" fill="#0C4A6E"/>
      <circle cx="38" cy="29" r="1.8" fill="#FFFFFF"/>
      <path d="M 30 43 Q 35 48 40 43" fill="none" stroke="#0C4A6E" stroke-width="2" stroke-linecap="round"/>
    </g>
    <rect x="0" y="86" width="100" height="22" rx="11" fill="#E0F2FE"/>
    <text x="50" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="10.5" font-weight="800" fill="#0284C7" text-anchor="middle">
      Blueberry ▶
    </text>
    <text x="50" y="122" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">
      Common • 1×1
    </text>
  </g>

  <!-- 3. Lemon Spark -->
  <g transform="translate(255, 14)">
    <g transform="translate(18, 6)" filter="url(#clShadow)">
      <rect x="0" y="0" width="64" height="64" rx="22" fill="url(#clLm)"/>
      <path d="M 2 22 Q -8 32 2 42 Z" fill="#FFB703"/>
      <rect x="10" y="8" width="24" height="12" rx="6" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="28" cy="31" r="5" fill="#78350F"/>
      <circle cx="26" cy="29" r="1.8" fill="#FFFFFF"/>
      <path d="M 24 43 Q 29 48 34 43" fill="none" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
    </g>
    <rect x="0" y="86" width="100" height="22" rx="11" fill="#FEF3C7"/>
    <text x="50" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="10.5" font-weight="800" fill="#D97706" text-anchor="middle">
      Lemon Spark ◀
    </text>
    <text x="50" y="122" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">
      Rare • 1×1
    </text>
  </g>

  <!-- 4. Kiwi Hopper -->
  <g transform="translate(370, 14)">
    <g transform="translate(18, 6)" filter="url(#clShadow)">
      <rect x="0" y="0" width="64" height="64" rx="22" fill="url(#clKw)"/>
      <path d="M 22 62 Q 32 72 42 62 Z" fill="#06D6A0"/>
      <rect x="10" y="8" width="24" height="12" rx="6" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="21" cy="30" r="5" fill="#064E3B"/>
      <circle cx="20" cy="29" r="1.5" fill="#FFFFFF"/>
      <circle cx="43" cy="30" r="5" fill="#064E3B"/>
      <circle cx="42" cy="29" r="1.5" fill="#FFFFFF"/>
      <path d="M 27 41 Q 32 46 37 41" fill="none" stroke="#064E3B" stroke-width="2" stroke-linecap="round"/>
    </g>
    <rect x="0" y="86" width="100" height="22" rx="11" fill="#D1FAE5"/>
    <text x="50" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="10.5" font-weight="800" fill="#059669" text-anchor="middle">
      Kiwi Hopper ▼
    </text>
    <text x="50" y="122" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">
      Rare • 1×1
    </text>
  </g>

  <!-- 5. Grape Eel Duo (1x2) -->
  <g transform="translate(485, 14)">
    <g transform="translate(26, 0)" filter="url(#clShadow)">
      <rect x="0" y="0" width="48" height="72" rx="18" fill="url(#clEel)"/>
      <path d="M 16 2 Q 24 -6 32 2 Z" fill="#9D4EDD"/>
      <rect x="8" y="7" width="18" height="12" rx="6" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="17" cy="26" r="4.2" fill="#3B0764"/>
      <circle cx="31" cy="26" r="4.2" fill="#3B0764"/>
      <path d="M 20 38 Q 24 43 28 38" fill="none" stroke="#3B0764" stroke-width="1.8" stroke-linecap="round"/>
      <text x="24" y="58" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#E9D5FF" text-anchor="middle">1×2</text>
    </g>
    <rect x="0" y="86" width="100" height="22" rx="11" fill="#F3E8FF"/>
    <text x="50" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="10.5" font-weight="800" fill="#7C3AED" text-anchor="middle">
      Grape Eel ▲
    </text>
    <text x="50" y="122" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">
      Mythic • 1×2
    </text>
  </g>

  <!-- 6. Honeycomb King Jelly Boss (2x2) -->
  <g transform="translate(600, 14)">
    <g transform="translate(14, 0)" filter="url(#clShadow)">
      <rect x="0" y="0" width="72" height="72" rx="26" fill="url(#clKing)"/>
      <rect x="12" y="9" width="26" height="15" rx="7.5" fill="#FFFFFF" opacity="0.6"/>
      <path d="M 16 -10 L 24 -1 L 36 -14 L 48 -1 L 56 -10 L 53 2 L 19 2 Z" fill="url(#clCrown)" stroke="#B45309" stroke-width="1.2"/>
      <circle cx="36" cy="-9" r="2.5" fill="#EF4444"/>
      <circle cx="26" cy="34" r="5" fill="#7C2D12"/>
      <circle cx="28" cy="32" r="1.8" fill="#FFFFFF"/>
      <circle cx="46" cy="34" r="5" fill="#7C2D12"/>
      <circle cx="48" cy="32" r="1.8" fill="#FFFFFF"/>
      <path d="M 31 46 Q 36 51 41 46" fill="none" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>
    </g>
    <rect x="0" y="86" width="100" height="22" rx="11" fill="#FFEDD5"/>
    <text x="50" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="10.5" font-weight="800" fill="#C2410C" text-anchor="middle">
      King Jelly 👑
    </text>
    <text x="50" y="122" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">
      Boss • 2×2
    </text>
  </g>

  <!-- 7. Cosmic Nebula (Legendary) -->
  <g transform="translate(715, 14)">
    <g transform="translate(18, 6)" filter="url(#clShadow)">
      <rect x="0" y="0" width="64" height="64" rx="22" fill="url(#clCosmic)"/>
      <path d="M 32 4 Q 32 10 36 10 Q 32 10 32 16 Q 32 10 28 10 Q 32 10 32 4 Z" fill="#FDE047"/>
      <circle cx="21" cy="30" r="4.5" fill="#FFFFFF"/>
      <circle cx="43" cy="30" r="4.5" fill="#FFFFFF"/>
      <path d="M 27 42 Q 32 47 37 42" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </g>
    <rect x="0" y="86" width="100" height="22" rx="11" fill="#EDE9FE"/>
    <text x="50" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="10.5" font-weight="800" fill="#6D28D9" text-anchor="middle">
      Cosmic ✨
    </text>
    <text x="50" y="122" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">
      Legendary • 1×1
    </text>
  </g>

</svg>
