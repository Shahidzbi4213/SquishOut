<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FBF6"/>
      <stop offset="50%" stop-color="#FCFCFA"/>
      <stop offset="100%" stop-color="#EDF7FC"/>
    </linearGradient>

    <!-- 3D Logo Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="45%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </linearGradient>

    <!-- Logo Glaze Highlight -->
    <linearGradient id="titleHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Mascot Radial Shaders -->
    <radialGradient id="mStrawberry" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFA8BA"/>
      <stop offset="55%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </radialGradient>

    <radialGradient id="mBlueberry" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#90E0EF"/>
      <stop offset="55%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </radialGradient>

    <radialGradient id="mLemon" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="55%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <radialGradient id="mKiwi" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="55%" stop-color="#06D6A0"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <radialGradient id="mKing" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="55%" stop-color="#FB8500"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>

    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="softDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#14321E" flood-opacity="0.10"/>
    </filter>

    <style>
      @keyframes gentleFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes gentleFloatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes starBlink {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 0.95; transform: scale(1.15); }
      }
      .anim-mascot-main { animation: gentleFloat 3.2s ease-in-out infinite; transform-origin: center; }
      .anim-mascot-left { animation: gentleFloatAlt 3.6s ease-in-out infinite 0.4s; transform-origin: center; }
      .anim-mascot-right { animation: gentleFloat 4.0s ease-in-out infinite 0.8s; transform-origin: center; }
      .anim-star-1 { animation: starBlink 2.6s ease-in-out infinite; transform-origin: center; }
      .anim-star-2 { animation: starBlink 3.2s ease-in-out infinite 1s; transform-origin: center; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="836" height="286" rx="24" fill="url(#bannerBg)" stroke="#BCE3CD" stroke-width="1.75"/>

  <!-- Subtle Background Meadow Atmosphere (Bubbles & Flora) -->
  <g opacity="0.35">
    <circle cx="85" cy="55" r="14" fill="#86EFAC"/>
    <circle cx="755" cy="50" r="16" fill="#93C5FD"/>
    <circle cx="210" cy="40" r="8" fill="#FDE68A"/>
    <circle cx="630" cy="45" r="10" fill="#FBCFE8"/>
  </g>

  <!-- Sparkle Stars -->
  <g class="anim-star-1" transform="translate(250, 48)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#F59E0B"/>
  </g>
  <g class="anim-star-2" transform="translate(590, 44)">
    <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#EC4899"/>
  </g>

  <!-- LEFT FLANK: Blueberry Drop & Lemon Spark -->
  <g class="anim-mascot-left">
    <!-- Blueberry Drop (Facing East ▶) -->
    <g transform="translate(48, 85)" filter="url(#softDropShadow)">
      <rect x="0" y="0" width="68" height="68" rx="24" fill="url(#mBlueberry)"/>
      <path d="M 66 24 Q 78 34 66 44 Z" fill="#00B4D8"/>
      <!-- Specular Highlight -->
      <rect x="10" y="8" width="24" height="13" rx="6.5" fill="#FFFFFF" opacity="0.6"/>
      <!-- Eyes looking east -->
      <circle cx="38" cy="33" r="5" fill="#0C4A6E"/>
      <circle cx="40" cy="31" r="1.8" fill="#FFFFFF"/>
      <path d="M 32 46 Q 38 51 44 46" fill="none" stroke="#0C4A6E" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Lemon Spark (Facing West ◀, Below Blueberry) -->
    <g transform="translate(98, 165)" filter="url(#softDropShadow)">
      <rect x="0" y="0" width="60" height="60" rx="22" fill="url(#mLemon)"/>
      <path d="M 2 20 Q -8 30 2 40 Z" fill="#FFB703"/>
      <rect x="10" y="7" width="20" height="11" rx="5.5" fill="#FFFFFF" opacity="0.6"/>
      <!-- Closed sleepy cute eye -->
      <path d="M 18 29 Q 24 35 30 29" fill="none" stroke="#78350F" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 34 29 Q 40 35 46 29" fill="none" stroke="#78350F" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 28 41 Q 32 45 36 41" fill="none" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- CENTER HERO: Strawberry Mascot, Title & Badges -->
  <g transform="translate(420, 26)">
    <!-- Hero Strawberry Blobby (Awake with Star Eyes ✦‿✦) -->
    <g class="anim-mascot-main" transform="translate(-36, 0)" filter="url(#softDropShadow)">
      <!-- Golden Awake Rim Aura -->
      <rect x="-3" y="-3" width="78" height="78" rx="28" fill="none" stroke="#FDE047" stroke-width="3" opacity="0.85"/>
      <!-- Body -->
      <rect x="0" y="0" width="72" height="72" rx="26" fill="url(#mStrawberry)"/>
      <!-- Directional Crown Snout (North ▲) -->
      <path d="M 25 3 Q 36 -11 47 3 Z" fill="#FF4D6D"/>
      <!-- Specular Highlight -->
      <rect x="11" y="9" width="27" height="15" rx="7.5" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="45" cy="15" r="3.5" fill="#FFFFFF" opacity="0.5"/>
      <!-- Sparkling Star Pupils ( ✦‿✦ ) -->
      <g transform="translate(19, 30)">
        <circle cx="6" cy="6" r="6" fill="#881337"/>
        <path d="M 6 2 Q 6 6 8.5 6 Q 6 6 6 10 Q 6 6 3.5 6 Q 6 6 6 2 Z" fill="#FFFFFF"/>
      </g>
      <g transform="translate(41, 30)">
        <circle cx="6" cy="6" r="6" fill="#881337"/>
        <path d="M 6 2 Q 6 6 8.5 6 Q 6 6 6 10 Q 6 6 3.5 6 Q 6 6 6 2 Z" fill="#FFFFFF"/>
      </g>
      <!-- Rosy Cheeks & Cheerful Smile -->
      <ellipse cx="16" cy="43" rx="5" ry="3" fill="#FB7185" opacity="0.7"/>
      <ellipse cx="56" cy="43" rx="5" ry="3" fill="#FB7185" opacity="0.7"/>
      <path d="M 31 42 Q 36 49 41 42" fill="none" stroke="#881337" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- 3D Candy Typography: SQUISH OUT -->
    <!-- Extruded 3D Base -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#9F1239" text-anchor="middle" letter-spacing="-0.5">
      SQUISH OUT
    </text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#BE123C" text-anchor="middle" letter-spacing="-0.5">
      SQUISH OUT
    </text>
    <!-- Vibrant Face -->
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-0.5">
      SQUISH OUT
    </text>
    <!-- Top Gloss Shine -->
    <text x="0" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#titleHighlight)" text-anchor="middle" letter-spacing="-0.5" opacity="0.45">
      SQUISH OUT
    </text>

    <!-- Tagline & Description -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#1E293B" text-anchor="middle" letter-spacing="0.2">
      Kawaii Directional Unblocking Puzzle
    </text>
    <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">
      Built for Android &amp; iOS with Compose Multiplatform &amp; Skia Canvas
    </text>

    <!-- 4 Balanced Pill Badges (Widths: ~110px each, Total width ~470px, centered around 0) -->
    <g transform="translate(-235, 208)">
      <!-- Badge 1: 150 Stages -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
        <text x="55" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="11" font-weight="800" fill="#15803D" text-anchor="middle">
          🍓 150 Stages
        </text>
      </g>
      <!-- Badge 2: 6 Biomes -->
      <g transform="translate(120, 0)">
        <rect x="0" y="0" width="105" height="28" rx="14" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.2"/>
        <text x="52.5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="11" font-weight="800" fill="#B45309" text-anchor="middle">
          🌸 6 Biomes
        </text>
      </g>
      <!-- Badge 3: 100% Solvable -->
      <g transform="translate(235, 0)">
        <rect x="0" y="0" width="115" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
        <text x="57.5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="11" font-weight="800" fill="#1D4ED8" text-anchor="middle">
          🧩 100% Solvable
        </text>
      </g>
      <!-- Badge 4: 120 FPS Skia -->
      <g transform="translate(360, 0)">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="#FDF4FF" stroke="#F5D0FE" stroke-width="1.2"/>
        <text x="55" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="11" font-weight="800" fill="#A21CAF" text-anchor="middle">
          ⚡ 120 FPS Skia
        </text>
      </g>
    </g>
  </g>

  <!-- RIGHT FLANK: Honeycomb King Jelly & Kiwi Hopper -->
  <g class="anim-mascot-right">
    <!-- King Jelly Boss (2x2 Giant with Crown) -->
    <g transform="translate(712, 75)" filter="url(#softDropShadow)">
      <rect x="0" y="0" width="80" height="80" rx="30" fill="url(#mKing)"/>
      <rect x="13" y="10" width="28" height="17" rx="8.5" fill="#FFFFFF" opacity="0.6"/>
      <!-- Royal Crown -->
      <path d="M 18 -12 L 26 -2 L 40 -16 L 54 -2 L 62 -12 L 59 2 L 21 2 Z" fill="url(#goldCrown)" stroke="#B45309" stroke-width="1.2"/>
      <circle cx="40" cy="-11" r="2.8" fill="#EF4444"/>
      <circle cx="23" cy="-7" r="2" fill="#3B82F6"/>
      <circle cx="57" cy="-7" r="2" fill="#10B981"/>
      <!-- Smiling Eyes -->
      <circle cx="28" cy="38" r="5" fill="#7C2D12"/>
      <circle cx="30" cy="36" r="1.8" fill="#FFFFFF"/>
      <circle cx="52" cy="38" r="5" fill="#7C2D12"/>
      <circle cx="54" cy="36" r="1.8" fill="#FFFFFF"/>
      <path d="M 35 50 Q 40 55 45 50" fill="none" stroke="#7C2D12" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Kiwi Gummy (Facing South ▼, Below King Jelly) -->
    <g transform="translate(680, 175)" filter="url(#softDropShadow)">
      <rect x="0" y="0" width="58" height="58" rx="20" fill="url(#mKiwi)"/>
      <path d="M 19 56 Q 29 66 39 56 Z" fill="#06D6A0"/>
      <rect x="8" y="7" width="20" height="10" rx="5" fill="#FFFFFF" opacity="0.6"/>
      <!-- Eyes Awake looking South -->
      <circle cx="19" cy="27" r="4.2" fill="#064E3B"/>
      <circle cx="18" cy="26" r="1.5" fill="#FFFFFF"/>
      <circle cx="39" cy="27" r="4.2" fill="#064E3B"/>
      <circle cx="38" cy="26" r="1.5" fill="#FFFFFF"/>
      <path d="M 25 38 Q 29 42 33 38" fill="none" stroke="#064E3B" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
