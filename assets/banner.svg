<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F9EE"/>
      <stop offset="45%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <!-- Logo 3D Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="40%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </linearGradient>

    <!-- Logo Highlight -->
    <linearGradient id="logoHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Strawberry Blobby Gradients -->
    <radialGradient id="strawberryGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFA8BA"/>
      <stop offset="50%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </radialGradient>

    <!-- Blueberry Drop Gradients -->
    <radialGradient id="blueberryGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#90E0EF"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </radialGradient>

    <!-- Lemon Spark Gradients -->
    <radialGradient id="lemonGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Kiwi Hopper Gradients -->
    <radialGradient id="kiwiGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#06D6A0"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <!-- King Jelly Gradients -->
    <radialGradient id="kingGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#FB8500"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>

    <!-- Gold Crown Gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#14321E" flood-opacity="0.12"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(1.5deg); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-9px) rotate(-2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.05); }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.2) rotate(45deg); }
      }
      .floating-jelly-1 { animation: floatSlow 3.2s ease-in-out infinite; transform-origin: center; }
      .floating-jelly-2 { animation: floatAlt 3.8s ease-in-out infinite; transform-origin: center; }
      .floating-jelly-3 { animation: floatSlow 4.2s ease-in-out infinite 0.6s; transform-origin: center; }
      .floating-jelly-4 { animation: floatAlt 3.5s ease-in-out infinite 1.2s; transform-origin: center; }
      .floating-jelly-5 { animation: floatSlow 4.5s ease-in-out infinite 0.3s; transform-origin: center; }
      .star-twinkle-1 { animation: starTwinkle 2.5s ease-in-out infinite; transform-origin: center; }
      .star-twinkle-2 { animation: starTwinkle 3s ease-in-out infinite 1s; transform-origin: center; }
      .star-twinkle-3 { animation: starTwinkle 2.2s ease-in-out infinite 0.5s; transform-origin: center; }
      .glow-pulse { animation: pulseGlow 2.4s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Card Border & Background -->
  <rect x="2" y="2" width="836" height="326" rx="28" fill="url(#bgGrad)" stroke="#B7E4C7" stroke-width="2"/>

  <!-- Background Meadow Pattern / Bubbles -->
  <g opacity="0.45">
    <circle cx="80" cy="60" r="18" fill="#DCFCE7"/>
    <circle cx="160" cy="40" r="8" fill="#FEE440" opacity="0.6"/>
    <circle cx="760" cy="80" r="22" fill="#BAE6FD"/>
    <circle cx="680" cy="45" r="12" fill="#FFCCD5"/>
    <circle cx="790" cy="240" r="15" fill="#E9D5FF"/>
    <circle cx="70" cy="270" r="20" fill="#DCFCE7"/>
  </g>

  <!-- Twinkling Sparkle Stars -->
  <g class="star-twinkle-1">
    <path d="M 230 45 Q 230 55 240 55 Q 230 55 230 65 Q 230 55 220 55 Q 230 55 230 45" fill="#FBBF24"/>
  </g>
  <g class="star-twinkle-2">
    <path d="M 610 50 Q 610 62 622 62 Q 610 62 610 74 Q 610 62 598 62 Q 610 62 610 50" fill="#FBBF24"/>
  </g>
  <g class="star-twinkle-3">
    <path d="M 390 30 Q 390 38 398 38 Q 390 38 390 46 Q 390 38 382 38 Q 390 38 390 30" fill="#F472B6"/>
  </g>

  <!-- Left Side: Mascot Group Showcase -->
  <!-- 1. Kiwi Gummy (Bottom Left, Facing South) -->
  <g class="floating-jelly-4" transform="translate(48, 175)" filter="url(#softShadow)">
    <rect x="0" y="0" width="70" height="70" rx="26" fill="url(#kiwiGrad)"/>
    <!-- Snout pointing South -->
    <path d="M 24 66 Q 35 80 46 66 Z" fill="#06D6A0"/>
    <!-- Specular -->
    <rect x="10" y="8" width="26" height="15" rx="7" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="44" cy="14" r="3.5" fill="#FFFFFF" opacity="0.5"/>
    <!-- Sleepy Eyes (Facing down) -->
    <path d="M 20 36 Q 27 42 34 36" fill="none" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 38 36 Q 45 42 52 36" fill="none" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 33 47 Q 36 50 39 47" fill="none" stroke="#064E3B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 2. Lemon Spark (Top Left, Facing West) -->
  <g class="floating-jelly-2" transform="translate(85, 60)" filter="url(#softShadow)">
    <rect x="0" y="0" width="68" height="68" rx="25" fill="url(#lemonGrad)"/>
    <!-- Snout pointing West -->
    <path d="M 4 23 Q -10 34 4 45 Z" fill="#FFB703"/>
    <!-- Specular -->
    <rect x="12" y="8" width="24" height="14" rx="7" fill="#FFFFFF" opacity="0.6"/>
    <!-- Cute Winking / Awake Eye -->
    <circle cx="28" cy="34" r="5" fill="#78350F"/>
    <circle cx="27" cy="32" r="2" fill="#FFFFFF"/>
    <path d="M 42 35 Q 47 30 52 35" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 33 46 Q 37 51 42 46" fill="none" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 3. Strawberry Blobby (HERO MASCOT, Center-Left, Facing North ▲, AWAKE & SPARKLING!) -->
  <g class="floating-jelly-1" transform="translate(142, 110)" filter="url(#softShadow)">
    <!-- Golden Awake Aura Glow -->
    <rect x="-6" y="-6" width="102" height="102" rx="38" fill="none" stroke="#FDE047" stroke-width="3" opacity="0.8" class="glow-pulse"/>
    <!-- Body -->
    <rect x="0" y="0" width="90" height="90" rx="34" fill="url(#strawberryGrad)"/>
    <!-- Crown Snout pointing North -->
    <path d="M 32 4 Q 45 -14 58 4 Z" fill="#FF4D6D"/>
    <!-- White Specular Glaze -->
    <rect x="14" y="10" width="34" height="20" rx="10" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="56" cy="18" r="4.5" fill="#FFFFFF" opacity="0.55"/>
    <!-- AWAKE SPARKLING EYES ( ✦‿✦ ) -->
    <g transform="translate(24, 38)">
      <circle cx="8" cy="8" r="7.5" fill="#881337"/>
      <!-- Star glint in eye -->
      <path d="M 8 3 Q 8 8 11 8 Q 8 8 8 13 Q 8 8 5 8 Q 8 8 8 3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(50, 38)">
      <circle cx="8" cy="8" r="7.5" fill="#881337"/>
      <!-- Star glint in eye -->
      <path d="M 8 3 Q 8 8 11 8 Q 8 8 8 13 Q 8 8 5 8 Q 8 8 8 3" fill="#FFFFFF"/>
    </g>
    <!-- Rosy Cheek Blushes -->
    <ellipse cx="20" cy="54" rx="6" ry="3.5" fill="#FB7185" opacity="0.6"/>
    <ellipse cx="70" cy="54" rx="6" ry="3.5" fill="#FB7185" opacity="0.6"/>
    <!-- Cheerful Smile -->
    <path d="M 39 52 Q 45 61 51 52" fill="#881337"/>
  </g>

  <!-- Center-Right: Game Title & Badges -->
  <g transform="translate(265, 38)">
    <!-- Category Pill Badge -->
    <g>
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#FFFFFF" stroke="#B7E4C7" stroke-width="1.5"/>
      <text x="140" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Fredoka', 'Nunito', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#059669" text-anchor="middle" letter-spacing="1.2">
        🍓 100% SOLVABLE PUZZLE • CMP
      </text>
    </g>

    <!-- 3D Candy Title "SQUISH OUT" -->
    <!-- 3D Lip / Drop Shadow -->
    <text x="1" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-size="58" font-weight="900" fill="#9F1239" letter-spacing="-1">
      SQUISH OUT
    </text>
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-size="58" font-weight="900" fill="#BE123C" letter-spacing="-1">
      SQUISH OUT
    </text>
    <!-- Front Face -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-size="58" font-weight="900" fill="url(#logoGrad)" letter-spacing="-1">
      SQUISH OUT
    </text>
    <!-- Top Gloss Shine on Text -->
    <text x="0" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-size="58" font-weight="900" fill="url(#logoHighlight)" letter-spacing="-1" opacity="0.45">
      SQUISH OUT
    </text>

    <!-- Subtitle -->
    <text x="2" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#374151" letter-spacing="0.2">
      Kawaii Directional Unblocking Puzzle
    </text>
    <text x="2" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6B7280">
      Built for Android &amp; iOS with Compose Multiplatform &amp; Skia
    </text>

    <!-- Interactive Metagame Feature Badges -->
    <g transform="translate(0, 168)">
      <!-- Badge 1: 150 Stages -->
      <g>
        <rect x="0" y="0" width="120" height="34" rx="17" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
        <text x="60" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="12" font-weight="800" fill="#15803D" text-anchor="middle">
          🗺️ 150 Stages
        </text>
      </g>
      <!-- Badge 2: 6 Biomes -->
      <g transform="translate(128, 0)">
        <rect x="0" y="0" width="114" height="34" rx="17" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>
        <text x="57" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="12" font-weight="800" fill="#B45309" text-anchor="middle">
          🌸 6 Biomes
        </text>
      </g>
      <!-- Badge 3: 120 FPS Skia -->
      <g transform="translate(250, 0)">
        <rect x="0" y="0" width="124" height="34" rx="17" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
        <text x="62" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="12" font-weight="800" fill="#1D4ED8" text-anchor="middle">
          ⚡ 120 FPS Skia
        </text>
      </g>
      <!-- Badge 4: Procedural Audio -->
      <g transform="translate(382, 0)">
        <rect x="0" y="0" width="142" height="34" rx="17" fill="#FDF4FF" stroke="#F5D0FE" stroke-width="1.5"/>
        <text x="71" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="12" font-weight="800" fill="#A21CAF" text-anchor="middle">
          🎶 16-bit Synth
        </text>
      </g>
    </g>

    <!-- Bottom Highlights Row -->
    <g transform="translate(0, 222)">
      <g>
        <circle cx="8" cy="8" r="4" fill="#10B981"/>
        <text x="20" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="12" font-weight="700" fill="#4B5563">
          Tactile Gummy Shaders
        </text>
      </g>
      <g transform="translate(170, 0)">
        <circle cx="8" cy="8" r="4" fill="#0EA5E9"/>
        <text x="20" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="12" font-weight="700" fill="#4B5563">
          Zero Emojis • 100% Vector Art
        </text>
      </g>
      <g transform="translate(370, 0)">
        <circle cx="8" cy="8" r="4" fill="#F59E0B"/>
        <text x="20" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', sans-serif" font-size="12" font-weight="700" fill="#4B5563">
          100% Tests Passing
        </text>
      </g>
    </g>
  </g>

  <!-- Far Right: King Jelly & Blueberry Drop -->
  <!-- 4. Honeycomb King Jelly Boss (2x2 Giant with Crown) -->
  <g class="floating-jelly-5" transform="translate(685, 95)" filter="url(#softShadow)">
    <rect x="0" y="0" width="98" height="98" rx="36" fill="url(#kingGrad)"/>
    <!-- Specular Highlight -->
    <rect x="16" y="12" width="36" height="22" rx="11" fill="#FFFFFF" opacity="0.6"/>
    <!-- Crown -->
    <path d="M 24 -14 L 33 -2 L 49 -20 L 65 -2 L 74 -14 L 70 2 L 28 2 Z" fill="url(#crownGrad)" stroke="#B45309" stroke-width="1.5"/>
    <circle cx="49" cy="-14" r="3" fill="#EF4444"/>
    <circle cx="28" cy="-10" r="2.2" fill="#3B82F6"/>
    <circle cx="70" cy="-10" r="2.2" fill="#10B981"/>
    <!-- King's Confident Smiling Eyes -->
    <circle cx="34" cy="46" r="6" fill="#7C2D12"/>
    <circle cx="36" cy="44" r="2" fill="#FFFFFF"/>
    <circle cx="64" cy="46" r="6" fill="#7C2D12"/>
    <circle cx="66" cy="44" r="2" fill="#FFFFFF"/>
    <!-- Royal Mustache / Smirk -->
    <path d="M 42 60 Q 49 66 56 60" fill="none" stroke="#7C2D12" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 5. Blueberry Drop (Facing East ▶, Top Right) -->
  <g class="floating-jelly-3" transform="translate(735, 195)" filter="url(#softShadow)">
    <rect x="0" y="0" width="66" height="66" rx="24" fill="url(#blueberryGrad)"/>
    <!-- Snout pointing East -->
    <path d="M 64 22 Q 78 33 64 44 Z" fill="#00B4D8"/>
    <!-- Specular -->
    <rect x="10" y="8" width="24" height="14" rx="7" fill="#FFFFFF" opacity="0.55"/>
    <!-- Eye looking right -->
    <circle cx="38" cy="32" r="5" fill="#0C4A6E"/>
    <circle cx="40" cy="30" r="2" fill="#FFFFFF"/>
    <!-- Smile -->
    <path d="M 32 44 Q 38 49 44 44" fill="none" stroke="#0C4A6E" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>
